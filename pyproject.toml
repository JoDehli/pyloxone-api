[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyloxone-api"
version = "0.3.0"
description = "Low-level async client for the Loxone Miniserver WebSocket API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14.2"
authors = [{ name = "Joachim Dehli" }]
keywords = ["loxone", "miniserver", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Home Automation",
]
# Lower bounds and major-version guards only. Home Assistant 2026.9.1 pins
# aiohttp==3.14.3 and requires websockets>=15.0.1; keep ranges wide enough
# to contain those pins so both can be installed in the same environment.
dependencies = [
    "aiohttp>=3.14.3,<4",
    "websockets>=15.0.1,<17",
    "pycryptodome>=3.20,<5",
]

[project.urls]
Homepage = "https://github.com/JoDehli/pyloxone-api"
Repository = "https://github.com/JoDehli/pyloxone-api"
"Bug Tracker" = "https://github.com/JoDehli/pyloxone-api/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyloxone_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not online'"
markers = ["online: needs network access to a Loxone Miniserver"]
