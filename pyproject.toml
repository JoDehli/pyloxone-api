[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyloxone-api"
version = "0.4.1"
description = "Low-level async client for the Loxone Miniserver WebSocket API"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Joachim Dehli" }]
keywords = ["loxone", "miniserver", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
# Lower bounds and major-version guards only. Home Assistant pins aiohttp
# exactly, so the ranges must contain the pins of every supported release:
# from 2025.2.4 (Python 3.13, aiohttp==3.11.12) up to 2026.8.0
# (Python 3.14, aiohttp==3.14.3). The lower bounds are the versions the
# offline test suite was run against; do not lower them without testing.
dependencies = [
    "aiohttp>=3.11.12,<4",
    "websockets>=14.0,<16",
    "pycryptodome>=3.20,<5",
]

[project.urls]
Homepage = "https://github.com/JoDehli/pyloxone-api"
Repository = "https://github.com/JoDehli/pyloxone-api"
"Bug Tracker" = "https://github.com/JoDehli/pyloxone-api/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.sdist]
# Working notes and device-specific files must never reach PyPI.
exclude = [
    "HANDOVER-pyloxone-api.md",
    "UEBERGABE-AENDERUNGEN.md",
    "1700_Structure-File.txt",
    "CommunicatingWithMiniserver.txt",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyloxone_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not online'"
markers = ["online: needs network access to a Loxone Miniserver"]
